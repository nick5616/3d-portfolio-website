[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Netlify Image CDN may resize/re-encode art straight from the public GCS
# bucket (see src/utils/artImages.ts). Only this bucket is allowed.
[images]
  remote_images = ["https://storage.googleapis.com/artandmedia/.*"]

# Hashed build output never changes under the same name.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Room textures: cache for a week, revalidate after.
[[headers]]
  for = "/textures/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[redirects]]
  from = "/api/console-chat"
  to = "/.netlify/functions/console-chat"
  status = 200

# SPA routing - redirect all non-existent paths to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev"
  functions = "netlify/functions"
  framework = "vite" 