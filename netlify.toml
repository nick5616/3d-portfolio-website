[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Hashed build output never changes under the same name.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Room textures: cache for a week, revalidate after.
[[headers]]
  for = "/textures/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[redirects]]
  from = "/api/console-chat"
  to = "/.netlify/functions/console-chat"
  status = 200

# 3d.saucedog.art is the world on its own (src/utils/site.ts): every page
# gets the nameless, noindex shell. Real files (assets, textures) still win,
# except index.html, which "/" would otherwise serve - hence the forced rules.
[[redirects]]
  from = "https://3d.saucedog.art/"
  to = "/world.html"
  status = 200
  force = true

[[redirects]]
  from = "https://www.3d.saucedog.art/"
  to = "/world.html"
  status = 200
  force = true

[[redirects]]
  from = "https://3d.saucedog.art/index.html"
  to = "/world.html"
  status = 200
  force = true

[[redirects]]
  from = "https://www.3d.saucedog.art/index.html"
  to = "/world.html"
  status = 200
  force = true

[[redirects]]
  from = "https://3d.saucedog.art/*"
  to = "/world.html"
  status = 200

[[redirects]]
  from = "https://www.3d.saucedog.art/*"
  to = "/world.html"
  status = 200

# SPA routing - redirect all non-existent paths to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev"
  functions = "netlify/functions"
  framework = "vite" 